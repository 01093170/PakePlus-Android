/* ---------- 移动端键盘避让 ----------
   只靠 scrollIntoView 不够：焦点框所在容器已经滚到底时，再滚也滚不出新距离，
   文本框永远压在键盘下面（就是你说的"到底了就上不去"）。改成两层处理：

   第一层 · 面板钉在键盘上方（解决弹窗最后一个输入框被挡）
   把实测键盘高度写进 CSS 变量 --kb：#modalRoot 的 bottom 收到键盘上沿，
   面板 max-height 同步按可视高度封顶。面板物理上不再伸到键盘底下，
   最后一个输入框变成"滚得到"的位置，而不是永远在可视区外面。
   日记的全屏编辑面板同样钉法。

   第二层 · 逐字段实测遮挡量（解决正文里的长文本框、以及面板内滚到底）
   1) 容器能滚 → 在它末尾临时补一段等高的空白，凭空多出可滚距离，再把这段距离滚掉；
   2) 容器内容太短根本滚不动 → 直接把整块容器上抬遮挡量；
   3) 页面正文 → 补空白后滚文档。

   两种 WebView 模式都兼容：resizes-content / adjustResize 下布局视口已被键盘缩小，
   kbHeight() 返回 0，--kb 为 0px，完全不干预；旧版 adjustPan 或不支持该属性时
   visualViewport 高度小于布局视口，按差值钉位。遮挡判定用可视视口坐标
   （含 visualViewport.offsetTop），pan 模式下同样成立。
   日期、下拉等不弹键盘的控件按实测判断，不会误加空白。 */
const KB_GAP_PAGE = 96;    // 页面内容底部要躲开约 84px 的底部导航
const KB_GAP_SHEET = 16;   // 弹窗 / 日记面板不受底部导航遮挡，留点呼吸即可
let kbSpacer = null, kbLiftNode = null, kbLift = 0, kbTimer = null;
var kbHeightVal = 0;   // 用 var：openModal 在本段之前就可能是调用，避免 let 的暂时性死区
// 键盘高度 = 布局视口高 − 可视视口高 − 可视视口偏移；resizes-content 模式下恒为 0
function kbFrom(innerH, visH, offTop){ return Math.max(0, Math.round(innerH - visH - (offTop||0))); }
function kbHeight(){
  const vv = window.visualViewport;
  if(!vv) return 0;
  return kbFrom(window.innerHeight, vv.height, vv.offsetTop);
}
// 把键盘高度写成 CSS 变量，让弹窗根节点与面板高度同步收缩
function kbSync(){
  const kb = kbHeight();
  if(kb === kbHeightVal) return kb;
  kbHeightVal = kb;
  document.documentElement.style.setProperty('--kb', kb+'px');
  return kb;
}
function kbIsField(el){
  if(!el || !el.tagName) return false;
  return el.tagName==='INPUT' || el.tagName==='TEXTAREA' || !!el.isContentEditable;
}
function kbScrollParent(el){
  let n = el.parentElement;
  while(n && n !== document.body){
    const oy = getComputedStyle(n).overflowY;
    if(oy==='auto' || oy==='scroll') return n;
    n = n.parentElement;
  }
  return null;                       // null → 走文档滚动
}
function kbClear(){
  if(kbTimer){ clearTimeout(kbTimer); kbTimer = null; }
  if(kbSpacer && kbSpacer.parentNode){ kbSpacer.parentNode.removeChild(kbSpacer); }
  kbSpacer = null;
  if(kbLiftNode){ kbLiftNode.style.transform = ''; kbLiftNode = null; }
  kbLift = 0;
}
function kbAddSpacer(host, h){
  const sp = document.createElement('div');
  sp.setAttribute('aria-hidden','true');
  sp.style.cssText = 'height:'+h+'px;min-height:'+h+'px;flex:none';
  host.appendChild(sp);
  kbSpacer = sp;
}
function kbLiftUp(node, px){
  kbLiftNode = node; kbLift = px;
  node.style.transform = 'translateY(-'+px+'px)';
}
function kbAvoid(el){
  kbSync();
  if(!kbIsField(el)) return;
  kbClear();
  const vv = window.visualViewport;
  const visH = vv ? vv.height : window.innerHeight;
  const offTop = vv ? (vv.offsetTop||0) : 0;           // 可视视口相对布局视口的偏移（pan 模式下非 0）
  const box = el.getBoundingClientRect();
  if(!box.height || !visH) return;
  const owner = kbScrollParent(el);
  const gap = owner ? KB_GAP_SHEET : KB_GAP_PAGE;
  let need = Math.ceil(box.bottom - offTop + gap - visH);
  if(box.height > visH - gap - 24) need = Math.ceil(box.bottom - offTop - visH*0.55 + gap); // 框过高：抬进可视区中上部
  if(need <= 0) return;
  if(owner){
    if(owner.scrollHeight > owner.clientHeight + 1){      // 面板内部可滚
      const before = owner.scrollTop;
      kbAddSpacer(owner, need);
      owner.scrollTop = before + need;
    }else{                                                 // 面板太短，滚不动 → 整块上抬
      kbLiftUp(owner, need);
    }
  }else{
    const host = document.getElementById('app') || document.body;
    const before = window.scrollY || window.pageYOffset || 0;
    kbAddSpacer(host, need);
    window.scrollTo(0, before + need);
  }
}
// 焦点一进来就先把 --kb 钉上（不等动画），再延后做逐字段的补位/上抬
document.addEventListener('focusin', e => {
  kbSync();
  clearTimeout(kbTimer);
  kbTimer = setTimeout(()=>kbAvoid(e.target), 300);       // 等键盘动画与浏览器自动滚动稳定
});
document.addEventListener('focusout', () => { setTimeout(()=>{ kbClear(); kbSync(); }, 150); });
window.addEventListener('resize', () => { kbSync(); });
if(window.visualViewport){
  const onVv = () => {
    kbSync();
    clearTimeout(kbTimer);
    kbTimer = setTimeout(()=>kbAvoid(document.activeElement), 260);
  };
  window.visualViewport.addEventListener('resize', onVv);
  window.visualViewport.addEventListener('scroll', onVv);
}
