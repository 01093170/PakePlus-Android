<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#eef4fa">
<title>人生RPG · 数据驱动的日常决策</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef4fa;--card:#ffffff;--card2:#f1f5f9;--line:#e2e8f0;
  --text:#0f172a;--sub:#64748b;--accent:#2563eb;--accent-ink:#ffffff;
  --green:#059669;--red:#dc2626;--blue:#2563eb;--orange:#d97706;--purple:#7c3aed;
  --acc-08:rgba(37, 99, 235, .08);--acc-10:rgba(37, 99, 235, .1);--acc-12:rgba(37, 99, 235, .12);
  --acc-20:rgba(37, 99, 235, .2);--acc-25:rgba(37, 99, 235, .25);--acc-35:rgba(37, 99, 235, .35);--acc-40:rgba(37, 99, 235, .4);
  --bar-bg:rgba(255,255,255,.86);--nav-bg:rgba(255,255,255,.96);
}
/* ---------- 全局三主题：蓝色（默认）/ 暖黄（原日记浅色）/ 黑色（原日记深色） ---------- */
body[data-theme="paper"]{
  --bg:#f6f3ec;--card:#fffdf8;--card2:#fbf8f2;--line:#e6e0d4;
  --text:#2b2823;--sub:#8b8378;--accent:#a8563a;--accent-ink:#ffffff;
  --green:#3d7a4f;--red:#b3382f;--blue:#a8563a;--orange:#a8563a;--purple:#8a4fb3;
  --acc-08:rgba(168,86,58,.09);--acc-10:rgba(168,86,58,.11);--acc-12:rgba(168,86,58,.12);
  --acc-20:rgba(168,86,58,.22);--acc-25:rgba(168,86,58,.26);--acc-35:rgba(168,86,58,.36);--acc-40:rgba(168,86,58,.4);
  --bar-bg:rgba(246,243,236,.92);--nav-bg:rgba(246,243,236,.96);
}
body[data-theme="dark"]{
  --bg:#1a1815;--card:#232019;--card2:#2a2620;--line:#38332b;
  --text:#ece7de;--sub:#9c948a;--accent:#d98a63;--accent-ink:#1a1815;
  --green:#7cbf8e;--red:#e5736a;--blue:#8ab4d8;--orange:#d9a063;--purple:#c39af0;
  --acc-08:rgba(217,138,99,.12);--acc-10:rgba(217,138,99,.14);--acc-12:rgba(217,138,99,.14);
  --acc-20:rgba(217,138,99,.26);--acc-25:rgba(217,138,99,.3);--acc-35:rgba(217,138,99,.4);--acc-40:rgba(217,138,99,.45);
  --bar-bg:rgba(26,24,21,.94);--nav-bg:rgba(26,24,21,.96);
}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:6px 14px;display:flex;align-items:center;gap:10px;min-height:42px}
.backbtn{display:flex;align-items:center;gap:3px;background:none;border:none;color:var(--sub);font-size:12px;font-weight:600;padding:4px 8px 4px 0;cursor:pointer;white-space:nowrap;font-family:inherit}
.titles{flex:1;min-width:0}
.t1{font-size:8px;color:var(--sub);letter-spacing:2px;font-weight:600}
.t2{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.topicon{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;padding:0;flex:none;font-family:inherit}
.topicon:active{color:var(--accent);border-color:var(--acc-40)}
/* ---------- 页面 ---------- */
main{padding:14px 14px 8px}
.page{display:none}
.page.active{display:block;animation:fadein .22s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.subview{animation:fadein .22s}
.hidden{display:none!important}
/* ---------- 底部导航 ---------- */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--nav-bg);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:30;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;background:none;border:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;cursor:pointer;font-family:inherit;font-weight:500}
.nav-btn .ni{display:flex;width:48px;height:28px;align-items:center;justify-content:center;border-radius:9px;transition:.2s}
.nav-btn.active{color:var(--accent);font-weight:700}
.nav-btn.active .ni{background:var(--acc-10)}
/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card.clickable{cursor:pointer;transition:.15s}
.card.clickable:active{transform:scale(.985);border-color:var(--accent)}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:active{opacity:.85}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;display:inline-block}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
h2{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.2px}
h3{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);font-weight:700;margin-bottom:8px}
h3 svg{color:var(--sub);flex:none}
.sub{font-size:12px;color:var(--sub);line-height:1.5}
.money{font-family:"SF Mono",Consolas,monospace}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--card2);color:var(--sub);margin-right:6px}
.tag.gold{background:var(--acc-08);color:var(--accent)}
.tag.green{background:rgba(5,150,105,.08);color:var(--green)}
.tag.red{background:rgba(220,38,38,.08);color:var(--red)}
.tag.blue{background:var(--acc-08);color:var(--blue)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:28px 10px;line-height:2}
.empty svg{display:block;margin:0 auto 8px;color:var(--sub)}
/* ---------- 表单 ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:64px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-12)}
.field .req::after{content:" *";color:var(--red)}
/* ---------- 进度条 / 等级 ---------- */
.seg5{display:flex;gap:5px;flex:1}
.seg5 i{flex:1;height:6px;border-radius:3px;background:var(--line);border:none}
.seg5 i.on{background:var(--accent);border-color:transparent}
.lv-badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--acc-08);border:1px solid var(--acc-20);padding:3px 10px;border-radius:10px;white-space:nowrap}
.sk-badge{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;margin-right:10px;letter-spacing:.5px}
.icon-box{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:var(--card2);color:var(--accent);flex:none}
input[type=range]{width:100%;accent-color:var(--accent);height:34px}
/* ---------- 时间轴 ---------- */
.timeline{position:relative;padding-left:22px;margin:10px 0}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--sub)}
.tl-item.done::before{background:var(--green);border-color:var(--green)}
.tl-item.goal::before{background:var(--accent);border-color:var(--accent)}
.tl-date{font-size:11px;color:var(--sub)}
/* ---------- 星级 ---------- */
.stars{display:flex;gap:4px;font-size:22px;cursor:pointer}
.stars span{color:#cbd5e1;transition:.15s}
.stars span.on{color:var(--accent)}
/* ---------- 图表 ---------- */
canvas.chart{width:100%;height:190px;display:block}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11px;color:var(--sub);margin-top:8px}
.chart-legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* ---------- 模态框 ---------- */
#modalRoot{position:fixed;inset:0;bottom:var(--kb,0px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modalRoot.hidden{display:none}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.modal-sheet{position:relative;width:100%;max-width:480px;max-height:84vh;max-height:min(84dvh, calc(100vh - var(--kb,0px) - 14px));overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;padding:16px 16px calc(28px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
/* ---------- Toast ---------- */
#toast{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-weight:600;font-size:14px;padding:11px 20px;border-radius:26px;z-index:80;box-shadow:0 8px 26px rgba(15,23,42,.28);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translate(-50%,-18px) scale(.8);opacity:0}}
.big-num{font-size:26px;font-weight:800;color:var(--text);font-family:"SF Mono",Consolas,monospace}
.divider{height:1px;background:var(--line);margin:12px 0}
/* ---------- 分段切换 ---------- */
.seg-bar{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg-btn{flex:1;background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;padding:9px 4px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.seg-btn svg{flex:none}
.iconpick{display:flex;align-items:center;justify-content:center;color:var(--sub)}
.iconpick.pickon{border-color:var(--accent);background:var(--acc-08);color:var(--accent)}
/* ---------- 图标 / 杂项 ---------- */
.ic{flex:none;vertical-align:-3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot-in{background:var(--green)}
.dot-out{background:var(--red)}
/* ---------- 浮动新建按钮 ---------- */
#fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px var(--acc-40);z-index:25;cursor:pointer;transition:transform .15s}
#fab:active{transform:scale(.9)}
/* ============ 日记页（整合自 diary.html，独立风格，#page-diary 作用域内） ============ */
#page-diary{--dy-font-serif:"Iowan Old Style",Georgia,"Times New Roman","Songti SC","STSong","Noto Serif CJK SC",serif;--dy-font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;--dy-bg:var(--bg);--dy-card:var(--card);--dy-card2:var(--card2);--dy-ink:var(--text);--dy-muted:var(--sub);--dy-line:var(--line);--dy-accent:var(--accent);--dy-accent-ink:var(--accent-ink);--dy-danger:var(--red);--dy-scrim:rgba(15,23,42,.45);--dy-chip:var(--card2)}
#page-diary{background:var(--dy-bg);color:var(--dy-ink);font-family:var(--dy-font-sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;border-radius:0}
#page-diary *{box-sizing:border-box}
#page-diary button{font-family:inherit;font-size:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--dy-line);background:var(--dy-card);color:var(--dy-ink);padding:8px 14px;line-height:1.3}
#page-diary button:hover{border-color:var(--dy-accent)}
#page-diary button:disabled{opacity:.38;cursor:default}
#page-diary button:disabled:hover{border-color:var(--dy-line)}
#page-diary .dy-btn-primary{background:var(--dy-accent);color:var(--dy-accent-ink);border-color:var(--dy-accent);font-weight:600}
#page-diary .dy-btn-primary:hover{filter:brightness(1.06)}
#page-diary .dy-btn-ghost{background:transparent;border-color:transparent;color:var(--dy-muted)}
#page-diary .dy-btn-ghost:hover{color:var(--dy-ink);border-color:var(--dy-line)}
#page-diary .dy-btn-danger{color:var(--dy-danger);border-color:var(--dy-line);background:transparent}
#page-diary .dy-btn-danger:hover{border-color:var(--dy-danger)}
#page-diary input,#page-diary textarea,#page-diary select{font-family:inherit;color:var(--dy-ink)}
#page-diary input[type=date],#page-diary input[type=text],#page-diary input[type=search]{background:var(--dy-card);border:1px solid var(--dy-line);border-radius:10px;padding:9px 12px;font-size:15px;width:100%}
#page-diary input:focus,#page-diary textarea:focus{outline:2px solid var(--dy-accent);outline-offset:1px;border-color:transparent}
#page-diary .dy-topbar{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
#page-diary .dy-brand{font-family:var(--dy-font-serif);font-size:21px;letter-spacing:.5px;margin-right:auto;display:flex;flex-direction:column;line-height:1.15}
#page-diary .dy-brand small{font-family:var(--dy-font-sans);font-size:11.5px;color:var(--dy-muted);letter-spacing:.3px;font-weight:400}
#page-diary .dy-stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:8px 0 4px;color:var(--dy-muted);font-size:13.5px}
#page-diary .dy-stats b{font-family:var(--dy-font-serif);font-size:19px;color:var(--dy-ink);font-weight:600;margin-right:3px}
#page-diary .dy-searchrow{display:flex;gap:8px;padding:10px 0 6px}
#page-diary section.dy-month{margin-top:22px}
#page-diary .dy-month-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--dy-line);padding-bottom:6px;margin-bottom:10px}
#page-diary .dy-month-head h2{font-family:var(--dy-font-serif);font-size:17px;margin:0;font-weight:600}
#page-diary .dy-month-head span{font-size:12.5px;color:var(--dy-muted)}
#page-diary .dy-entry{display:grid;grid-template-columns:54px 1fr;gap:12px;width:100%;text-align:left;background:var(--dy-card);border:1px solid var(--dy-line);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer;color:inherit}
#page-diary .dy-entry:hover{border-color:var(--dy-accent)}
#page-diary .dy-entry:focus-visible{outline:2px solid var(--dy-accent);outline-offset:2px}
#page-diary .dy-entry .day{font-family:var(--dy-font-serif);font-size:23px;line-height:1.05;text-align:center}
#page-diary .dy-entry .dow{display:block;font-family:var(--dy-font-sans);font-size:11px;color:var(--dy-muted);margin-top:2px}
#page-diary .dy-entry .t{font-weight:600;margin-bottom:2px;word-break:break-word}
#page-diary .dy-entry .s{color:var(--dy-muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
#page-diary .dy-entry .meta{font-size:11.5px;color:var(--dy-muted);margin-top:5px}
#page-diary .dy-empty{text-align:center;color:var(--dy-muted);padding:56px 10px 40px}
#page-diary .dy-empty h3{font-family:var(--dy-font-serif);color:var(--dy-ink);font-size:20px;margin:0 0 6px}
#page-diary .dy-empty p{margin:0 0 18px;font-size:14.5px}
#page-diary .dy-footnote{color:var(--dy-muted);font-size:12px;text-align:center;padding:34px 0 10px;line-height:1.7}
#page-diary .dy-overlay{position:fixed;inset:0;bottom:var(--kb,0px);background:var(--dy-scrim);z-index:60;display:flex;justify-content:center}
#page-diary .dy-overlay[hidden]{display:none}
#page-diary .dy-sheet{width:100%;max-width:480px;height:100%;background:var(--dy-bg);display:flex;flex-direction:column;border-left:1px solid var(--dy-line);border-right:1px solid var(--dy-line);padding-bottom:env(safe-area-inset-bottom)}
#page-diary .dy-sheet-head{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--dy-line);min-height:62px}
#page-diary .dy-sheet-head .title{font-family:var(--dy-font-serif);font-size:18px;margin-right:auto}
#page-diary .dy-sheet-body{flex:1;overflow-y:auto;padding:18px}
#page-diary .dy-sheet-foot{border-top:1px solid var(--dy-line);padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dy-muted)}
#dyEditorBody{flex:1;width:100%;border:0;background:transparent;font-family:var(--dy-font-serif);font-size:18px;line-height:1.85;resize:none;padding:0 0 30px}
#dyEditorTitle{border:0;background:transparent;font-family:var(--dy-font-serif);font-size:22px;font-weight:600;padding:0;margin-bottom:8px;width:auto}
#dyEditorTitle::placeholder{color:var(--dy-muted);font-weight:400}
#page-diary .dy-readbody{font-family:var(--dy-font-serif);font-size:18.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word;margin-top:6px}
#page-diary .dy-readhead h2{font-family:var(--dy-font-serif);font-size:24px;margin:0 0 4px;line-height:1.35;word-break:break-word}
#page-diary .dy-readhead .date{color:var(--dy-accent);font-size:14px;font-weight:600}
#page-diary .dy-readhead .meta{color:var(--dy-muted);font-size:12.5px;margin-top:6px}
#page-diary hr{border:0;border-top:1px solid var(--dy-line);margin:22px 0}
#page-diary .dy-panel-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--dy-line)}
#page-diary .dy-panel-row .lab{flex:1}
#page-diary .dy-panel-row .lab b{display:block;font-weight:600}
#page-diary .dy-panel-row .lab small{color:var(--dy-muted);font-size:12.5px;display:block;margin-top:2px;line-height:1.5}
#page-diary .dy-trash-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--dy-line)}
#page-diary .dy-trash-item .ti-t{font-weight:600;word-break:break-word}
#page-diary .dy-trash-item .ti-s{color:var(--dy-muted);font-size:13px;word-break:break-word}
#page-diary .dy-trash-item .ti-a{display:flex;gap:6px}
#page-diary fieldset{border:1px solid var(--dy-line);border-radius:12px;padding:10px 12px;margin:0 0 16px}
#page-diary legend{padding:0 6px;font-size:13px;color:var(--dy-muted)}
#page-diary .dy-seg{display:flex;gap:6px}
#page-diary .dy-seg button[aria-pressed=true]{background:var(--dy-accent);color:var(--dy-accent-ink);border-color:var(--dy-accent)}
#page-diary .dy-note{font-size:13px;color:var(--dy-muted);line-height:1.7}
#dyToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dy-ink);color:var(--dy-bg);border-radius:12px;padding:10px 14px;font-size:14px;display:none;z-index:90;align-items:center;gap:12px;max-width:92vw}
#dyToast button{background:transparent;border-color:var(--dy-bg);color:var(--dy-bg)}
@media (max-width:520px){
#page-diary .dy-entry{grid-template-columns:44px 1fr}
#page-diary .dy-sheet-body{padding:14px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="backBtn" class="backbtn hidden" onclick="goBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>返回</button>
    <div class="titles">
      <div class="t1">LIFE · RPG</div>
      <div class="t2" id="pageTitle">技能</div>
    </div>
    <button class="topicon" onclick="openDataModal()" title="数据导出 / 导入" aria-label="数据管理">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
  </header>

  <main>
    <!-- ============ 技能页 ============ -->
    <section class="page active" id="page-skill">
      <div id="view-skill-list">
        <div id="skillFilter" class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
        <div id="skillList" class="stack"></div>
      </div>
      <div id="view-skill-detail" class="subview hidden"></div>
      <div id="view-level-detail" class="subview hidden"></div>
    </section>

    <!-- ============ 财富页 ============ -->
    <section class="page" id="page-wealth">
      <div class="seg-bar">
        <button class="seg-btn active" id="seg-items" onclick="switchWealthTab('items')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg>物品日均成本</button>
        <button class="seg-btn" id="seg-cash" onclick="switchWealthTab('cash')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>现金流</button>
        <button class="seg-btn" id="seg-assets" onclick="switchWealthTab('assets')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m23 6-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>资产</button>
      </div>
      <div id="wealth-items" style="margin-top:12px"></div>
      <div id="wealth-cash" class="hidden" style="margin-top:12px"></div>
      <div id="wealth-assets" class="hidden" style="margin-top:12px"></div>
    </section>

    <!-- ============ 健康页 ============ -->
    <section class="page" id="page-health">
      <div id="healthLife"></div>
      <div id="view-disease-list"></div>
      <div id="view-disease-detail" class="subview hidden"></div>
    </section>

    <!-- ============ 职业页 ============ -->
    <section class="page" id="page-career">
      <div id="view-career-list"></div>
      <div id="view-career-edit" class="subview hidden"></div>
      <div id="view-career-pays" class="subview hidden"></div>
    </section>

    <!-- ============ 日记页（整合自 diary.html） ============ -->
    <section class="page" id="page-diary">
      <div class="dy-topbar">
        <div class="dy-brand">我的日记<small id="dyTodayLabel"></small></div>
        <button class="dy-btn-ghost" id="dyBtnTheme" title="切换主题" aria-label="切换主题"></button>
        <button class="dy-btn-ghost" id="dyBtnSettings" title="设置与备份" aria-label="设置与备份">⚙︎</button>
        <button class="dy-btn-primary" id="dyBtnNew">写日记</button>
      </div>
      <div class="dy-stats" id="dyStats"></div>
      <div class="dy-searchrow"><input type="search" id="dySearch" placeholder="搜索标题、正文或日期，例如 2026-10" autocomplete="off"></div>
      <main class="dy-main" id="dyList"></main>
      <div class="dy-footnote" id="dyFootnote"></div>

      <!-- 编辑器 -->
      <div class="dy-overlay" id="dyEditorOverlay" hidden>
        <div class="dy-sheet" role="dialog" aria-modal="true" aria-label="写日记">
          <div class="dy-sheet-head">
            <div class="title" id="dyEditorHeadTitle">写日记</div>
            <input type="date" id="dyEditorDate" style="width:auto;max-width:150px">
            <button id="dyEditorDone">完成</button>
          </div>
          <div class="dy-sheet-body" style="display:flex;flex-direction:column">
            <input type="text" id="dyEditorTitle" placeholder="标题（可不填）" autocomplete="off">
            <textarea id="dyEditorBody" placeholder="今天发生了什么？随便写点什么都行……"></textarea>
          </div>
          <div class="dy-sheet-foot">
            <span id="dyEditorStatus">已保存</span>
            <span style="margin-left:auto" id="dyEditorCount"></span>
          </div>
        </div>
      </div>

      <!-- 阅读 -->
      <div class="dy-overlay" id="dyReadOverlay" hidden>
        <div class="dy-sheet" role="dialog" aria-modal="true" aria-label="日记内容">
          <div class="dy-sheet-head">
            <button class="dy-btn-ghost" id="dyReadClose">← 返回</button>
            <button class="dy-btn-ghost" id="dyReadPrev" title="更早一篇">‹</button>
            <button class="dy-btn-ghost" id="dyReadNext" title="更新一篇">›</button>
            <button id="dyReadEdit">编辑</button>
          </div>
          <div class="dy-sheet-body">
            <div class="dy-readhead">
              <div class="date" id="dyReadDate"></div>
              <h2 id="dyReadTitle"></h2>
              <div class="meta" id="dyReadMeta"></div>
            </div>
            <div class="dy-readbody" id="dyReadBody"></div>
          </div>
          <div class="dy-sheet-foot">
            <button class="dy-btn-danger" id="dyReadDelete">删除</button>
            <span style="margin-left:auto" id="dyReadPos"></span>
          </div>
        </div>
      </div>

      <!-- 设置 -->
      <div class="dy-overlay" id="dySettingsOverlay" hidden>
        <div class="dy-sheet" role="dialog" aria-modal="true" aria-label="设置">
          <div class="dy-sheet-head">
            <div class="title">设置与备份</div>
            <button id="dySettingsClose">关闭</button>
          </div>
          <div class="dy-sheet-body">
            <div class="dy-panel-row">
              <div class="lab"><b>主题颜色</b><small>蓝色 / 暖黄 / 黑色，全应用生效</small></div>
              <div class="dy-seg" id="dyThemeSeg">
                <button data-t="blue">蓝色</button><button data-t="paper">暖黄</button><button data-t="dark">黑色</button>
              </div>
            </div>
            <div class="dy-panel-row">
              <div class="lab"><b>导出备份</b><small id="dyBackupInfo">下载一个 JSON 文件，保存所有日记</small></div>
              <button id="dyBtnExport">导出</button>
            </div>
            <div class="dy-panel-row">
              <div class="lab"><b>导入备份</b><small>合并文件里的日记，已存在的按较新版本更新</small></div>
              <button id="dyBtnImport">选择文件</button>
            </div>
            <div class="dy-panel-row">
              <div class="lab"><b>回收站</b><small id="dyTrashInfo">删除的日记会先进这里</small></div>
              <button id="dyBtnTrash">打开</button>
            </div>
            <hr>
            <p class="dy-note">
              日记只保存在这台设备的这个浏览器里（localStorage），不会上传到任何服务器。
              换浏览器、换设备或清理站点数据都会导致记录丢失，所以建议<b>每周导出一次备份文件</b>。
              备份文件本身可以放在网盘或 U 盘里，之后用「导入备份」还原。
            </p>
            <p class="dy-note" id="dyStorageInfo"></p>
            <hr>
            <div class="dy-panel-row">
              <div class="lab"><b>清空全部数据</b><small>会先把所有日记导出为备份文件，再清空</small></div>
              <button class="dy-btn-danger" id="dyBtnWipe">清空</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 回收站 -->
      <div class="dy-overlay" id="dyTrashOverlay" hidden>
        <div class="dy-sheet" role="dialog" aria-modal="true" aria-label="回收站">
          <div class="dy-sheet-head">
            <div class="title">回收站</div>
            <button id="dyTrashClose">关闭</button>
          </div>
          <div class="dy-sheet-body" id="dyTrashList"></div>
        </div>
      </div>

      <div id="dyToast"></div>
      <input type="file" id="dyImportFile" accept="application/json,.json" hidden>
    </section>

  </nav>
</div>

/* ---------- 技能身份色：色相=是谁，明度=练度（需在 loadState 之前定义） ---------- */
const SKILL_TONES = [
  {h:211,s:85},{h:160,s:62},{h:265,s:60},{h:14,s:78},{h:43,s:85},{h:330,s:66},
  {h:190,s:68},{h:96,s:52},{h:0,s:72},{h:235,s:58},{h:75,s:58},{h:300,s:52},
  {h:172,s:44},{h:28,s:70},{h:255,s:50},{h:120,s:42}
];
const TONE_L = [76,68,60,50,42];                       // Lv1 淡 → Lv5 深
const TONE_S = [0.42,0.6,0.78,0.92,1];
function toneParts(sk, level){
  const idx = (((typeof sk.tone==='number'?sk.tone:0) % SKILL_TONES.length) + SKILL_TONES.length) % SKILL_TONES.length;
  const t = SKILL_TONES[idx];
  const i = Math.min(5,Math.max(1,level||1))-1;
  return {h:t.h, s:Math.round(t.s*TONE_S[i]), l:TONE_L[i]};
}
function skillColor(sk, level){ const p=toneParts(sk,level); return `hsl(${p.h},${p.s}%,${p.l}%)`; }
function skillTint(sk, level, a){ const p=toneParts(sk,level); return `hsla(${p.h},${p.s}%,${p.l}%,${a})`; }
// 色块背景是固定 hsl 色（不随主题变），所以文字色按明度定，不用主题变量
function skillInk(level){ return TONE_L[clamp(level,1,5)-1] >= 56 ? '#0f172a' : '#ffffff'; }
function skillInitial(name){
  const s = String(name||'').trim();
  if(!s) return '?';
  return /^[A-Za-z]/.test(s) ? s.slice(0,2).toUpperCase() : s[0];
}
// 旧数据 / 导入数据补发身份色与最近编辑时间（loadState 与导入共用）
function normalizeSkillTones(list){
  const taken = {};
  list.forEach(sk=>{ if(sk && typeof sk.tone==='number') taken[sk.tone]=1; });
  list.forEach(sk=>{
    if(!sk) return;
    if(typeof sk.tone!=='number'){
      let i=0; while(i<SKILL_TONES.length && taken[i]) i++;
      sk.tone = i % SKILL_TONES.length; taken[sk.tone]=1;
    }
    if(!sk.updatedAt) sk.updatedAt = sk.createdAt ? (new Date(sk.createdAt).getTime()||0) : 0;
  });
  return list;
}

    const s = JSON.parse(raw);

    merged.wealth = Object.assign({items:[],incomes:[],expenses:[],assets:[],fixed:[]}, merged.wealth);
    // 职业：补齐发薪记录数组（旧数据无 pays，首次使用时预期收入/工时作为兜底）

                 lv.valid&&'有效示例：'+lv.valid, lv.invalid&&'无效示例：'+lv.invalid]

    normalizeSkillTones(merged.skills||[]);

/* ============ 轻量图表引擎（Canvas，无外部依赖） ============ */
function ctxOf(canvas){
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  const w = Math.max(10, r.width), h = Math.max(10, r.height);
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
/* 折线图: series = [{name,color,data:[number|null],dash?}], labels 与 data 等长 */
function drawLineChart(canvas, series, labels){
  const {ctx,w,h} = ctxOf(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=38, padR=10, padT=14, padB=22;
  const iw=w-padL-padR, ih=h-padT-padB;
  let max=0;
  series.forEach(s=>s.data.forEach(v=>{ if(v!=null && v>max) max=v; }));
  if(max<=0) max=1;
  const nice = max<=1 ? max : Math.ceil(max/5)*5 || 1;
  const n = labels.length;
  const X = i => n<=1 ? padL+iw/2 : padL + iw*i/(n-1);
  const Y = v => padT + ih*(1 - v/nice);
  // 网格 + Y轴
  ctx.strokeStyle='#e2e8f0'; ctx.fillStyle='#94a3b8'; ctx.lineWidth=1; ctx.font='10px sans-serif';
  for(let g=0; g<=4; g++){
    const y = padT + ih*g/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    const val = nice*(1-g/4);
    ctx.fillText(val>=1000 ? (val/1000)+'k' : (Math.round(val*10)/10), 2, y+3);
  }
  // X轴标签（最多显示6个）
  ctx.textAlign='center';
  const step = Math.max(1, Math.ceil(n/6));
  labels.forEach((l,i)=>{ if(i%step===0 || i===n-1) ctx.fillText(l, X(i), h-6); });
  ctx.textAlign='left';
  // 折线
  series.forEach(s=>{
    ctx.strokeStyle=s.color; ctx.lineWidth=2.2; ctx.beginPath();
    let started=false;
    s.data.forEach((v,i)=>{
      if(v==null){ started=false; return; }
      const x=X(i), y=Y(v);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    });
    if(s.dash) ctx.setLineDash([5,4]);
    ctx.stroke(); ctx.setLineDash([]);
    s.data.forEach((v,i)=>{
      if(v==null) return;
      ctx.fillStyle=s.color;
      ctx.beginPath(); ctx.arc(X(i),Y(v),3,0,7); ctx.fill();
    });
  });
}
/* 环形图: segments = [{label,value,color}] */
function drawDonut(canvas, segments, centerText){
  const {ctx,w,h} = ctxOf(canvas);
  ctx.clearRect(0,0,w,h);
  const total = segments.reduce((a,s)=>a+s.value,0);
  const cx=w/2, cy=h/2, R=Math.max(4,Math.min(w,h)/2-8), r=R*0.62;
  const mid = Math.max(1,(R+r)/2);
  if(total<=0){
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=Math.max(1,R-r);
    ctx.beginPath(); ctx.arc(cx,cy,mid,0,7); ctx.stroke();
  }else{
    let ang=-Math.PI/2;
    segments.forEach(s=>{
      if(s.value<=0) return;
      const a2 = ang + s.value/total*Math.PI*2;
      ctx.strokeStyle=s.color; ctx.lineWidth=Math.max(1,R-r); ctx.lineCap='butt';
      ctx.beginPath(); ctx.arc(cx,cy,mid,ang+0.02,Math.max(ang+0.03,a2-0.02)); ctx.stroke();
      ang=a2;
    });
  }
  ctx.fillStyle = (document.body.getAttribute('data-theme')==='dark') ? '#ece7de' : (document.body.getAttribute('data-theme')==='paper' ? '#2b2823' : '#000000');
  ctx.textAlign='center'; ctx.font='700 15px sans-serif';
  ctx.fillText(centerText||'', cx, cy+5);
  ctx.textAlign='left';
}

function pickTone(){
  const used = {};
  state.skills.forEach(sk=>{ if(typeof sk.tone==='number') used[sk.tone]=(used[sk.tone]||0)+1; });
  for(let i=0;i<SKILL_TONES.length;i++) if(!used[i]) return i;
  let best=0;
  for(let i=1;i<SKILL_TONES.length;i++) if((used[i]||0) < (used[best]||0)) best=i;
  return best;
}

function skillGapIds(){
  const set = new Set();
  (state.career.target.skills||[]).forEach(ts=>{
    const sk = findSkill(ts.skillId);
    if(sk && ts.reqLevel > sk.level) set.add(sk.id);
  });
  return set;
}
function skillFilterCounts(){
  const gap = skillGapIds();
  return {
    all: state.skills.length,
    gap: state.skills.filter(s=>gap.has(s.id)).length,
    master: state.skills.filter(s=>s.level===5).length,
    novice: state.skills.filter(s=>s.level===1).length
  };
}
function skillVisible(sk, gapSet){
  if(skillFilter==='gap') return gapSet.has(sk.id);
  if(skillFilter==='master') return sk.level===5;
  if(skillFilter==='novice') return sk.level===1;
  return true;
}
function skillSortedList(){
  const gap = skillGapIds();
  return state.skills.filter(sk=>skillVisible(sk,gap))
    .sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0) || (a.createdAt||'').localeCompare(b.createdAt||'') );
}

function itemExtras(it){ return (it.extras||[]).reduce((a,e)=>a+num(e.amount),0); }
function itemDailyCost(it){ return (it.price + itemExtras(it)) / Math.max(1, it.lifeDays); }
function itemRemainDays(it){
  const used = daysBetween(it.buyDate, todayStr());
  return Math.max(0, it.lifeDays - used);
}

function monthKey(d){ return d.slice(0,7); }
function renderCashView(){
  const el = $('#wealth-cash');

  const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const incs = state.wealth.incomes.filter(i=>monthKey(i.date)===ym);
  const exps = state.wealth.expenses.filter(e=>monthKey(e.date)===ym);
  const payNow = payFor(ym), careerInc = payNow.income; // 工资取职业页发薪记录（缺失月份按最近记录/预期值推算）
  const fixed = (state.wealth.fixed||[]).filter(f=>monthKey(f.startDate||todayStr())<=ym);
  const fixedEss = fixed.filter(f=>f.category==='必需').reduce((a,f)=>a+num(f.amount),0);
  const fixedFun = fixed.filter(f=>f.category==='娱乐').reduce((a,f)=>a+num(f.amount),0);
  const fixedStu = fixed.filter(f=>f.category==='学习').reduce((a,f)=>a+num(f.amount),0);
  const totalIn = incs.reduce((a,i)=>a+i.amount,0) + careerInc;
  const ess = exps.filter(e=>e.category==='必需').reduce((a,e)=>a+e.amount,0) + fixedEss;
  const fun = exps.filter(e=>e.category==='娱乐').reduce((a,e)=>a+e.amount,0) + fixedFun;
  const stu = exps.filter(e=>e.category==='学习').reduce((a,e)=>a+e.amount,0) + fixedStu;
  const totalOut = ess+fun+stu;
  const free = totalIn - ess;
  // 生存天数：按本月日均必需开销折算
  const dayOfMonth = now.getDate();
  const dailyEss = ess/Math.max(1,dayOfMonth);
  const surviveDays = dailyEss>0 ? Math.floor(free/dailyEss) : (free>0?'∞':0);

  let html = `
    <div class="card" style="border-color:rgba(5,150,105,.3)">

        <span style="margin-left:auto">开销 <b style="color:var(--red)">${money(totalOut)}</b></span>
        <span style="margin-left:auto">结余 <b style="color:${totalIn-totalOut>=0?'var(--green)':'var(--red)'}">${money(totalIn-totalOut)}</b></span>
      </div>
    </div>
    <button class="btn btn-ghost" style="margin-bottom:12px" onclick="openExpenseModal()">+ 开销</button>
    <div class="card"><h3>${ic('list',15)} 每月固定开销（自动计入）</h3>
      ${fixed.length ? fixed.map(f=>`

          <div class="grow" style="margin-left:6px;min-width:0"><b>${esc(f.name)}</b><div class="sub money">自 ${f.startDate} 起每月自动计入</div></div>
          <b class="money" style="color:var(--red)">−${money(f.amount)}</b>
          <button class="btn btn-sm btn-ghost" style="margin-left:8px" onclick="delFixed('${f.id}')">${ic('x',14)}</button>
        </div>`).join('') : '<div class="sub" style="padding:6px 0">房租、订阅等固定开销加在这里，每月自动计入，无需重复输入</div>'}

    </div>
    <div class="card"><h3>${ic('pie',15)} 本月开销构成（${ym}）</h3>
      <canvas class="chart" id="cashDonut" style="height:170px"></canvas>
      <div class="chart-legend">
        <span><b style="background:#2563eb"></b>必需 ${money(ess)}</span>

      )}</div></div>`;
  el.innerHTML = html;

  requestAnimationFrame(()=>{
    drawDonut($('#cashDonut'), [
      {label:'必需',value:ess,color:'#2563eb'},
      {label:'娱乐',value:fun,color:'#f59e0b'},
      {label:'学习',value:stu,color:'#7c3aed'}

    // 近6个月结余
    const labels=[], balance=[];
    for(let m=5;m>=0;m--){

const CAT_LABEL = {'必需':'必需 · 房租/餐饮/交通','娱乐':'娱乐','学习':'学习'};

/* ---- 现金流：年度总结 ---- */
let cashAnnualYear = null;
function ymKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function curYmKey(){ const n=new Date(); return ymKey(n.getFullYear(), n.getMonth()+1); }
// 该月是否已发生、且晚于（或等于）起始月
function monthCounts(key, startStr){
  if(startStr && key < startStr.slice(0,7)) return false;
  return key <= curYmKey();
}
function cashYears(){
  const n = new Date();
  const set = new Set([String(n.getFullYear())]);
  state.wealth.incomes.forEach(i=>{ if(i.date) set.add(i.date.slice(0,4)); });
  state.wealth.expenses.forEach(e=>{ if(e.date) set.add(e.date.slice(0,4)); });
  (state.wealth.fixed||[]).forEach(f=>set.add(String((f.startDate||todayStr()).slice(0,4))));
  return [...set].sort().reverse();
}
function openCashAnnual(y){
  const years = cashYears();
  const year = y || cashAnnualYear || years[0];
  cashAnnualYear = year;
  let recMonths=0, estMonths=0;
  const labels=[], incomeData=[], outData=[], balData=[];
  let totalIn=0, ess=0, fun=0, stu=0;
  for(let m=1;m<=12;m++){
    const key = ymKey(year,m);
    const active = monthCounts(key);
    const payM = active ? payFor(key) : null;
    const wageM = payM ? payM.income : 0;
    const inM = wageM + state.wealth.incomes.filter(i=>monthKey(i.date)===key).reduce((a,i)=>a+num(i.amount),0);
    const fxM = (state.wealth.fixed||[]).filter(f=>monthCounts(key, f.startDate||todayStr())).reduce((a,f)=>a+num(f.amount),0);
    const expM = state.wealth.expenses.filter(e=>monthKey(e.date)===key);
    const outM = expM.reduce((a,e)=>a+num(e.amount),0) + fxM;
    ess += expM.filter(e=>e.category==='必需').reduce((a,e)=>a+num(e.amount),0)
          + (state.wealth.fixed||[]).filter(f=>f.category==='必需'&&monthCounts(key,f.startDate||todayStr())).reduce((a,f)=>a+num(f.amount),0);
    fun += expM.filter(e=>e.category==='娱乐').reduce((a,e)=>a+num(e.amount),0)
          + (state.wealth.fixed||[]).filter(f=>f.category==='娱乐'&&monthCounts(key,f.startDate||todayStr())).reduce((a,f)=>a+num(f.amount),0);
    stu += expM.filter(e=>e.category==='学习').reduce((a,e)=>a+num(e.amount),0)
          + (state.wealth.fixed||[]).filter(f=>f.category==='学习'&&monthCounts(key,f.startDate||todayStr())).reduce((a,f)=>a+num(f.amount),0);
    totalIn += inM;
    labels.push(m+'月'); incomeData.push(inM); outData.push(outM); balData.push(inM-outM);
    if(wageM>0){ payM.src==='record' ? recMonths++ : estMonths++; }
  }
  const totalOut = ess+fun+stu;
  const wageN = recMonths+estMonths;
  const wageDesc = wageN ? ' · 工资计入 '+wageN+' 个月（'+[recMonths?recMonths+' 个月发薪记录':'', estMonths?estMonths+' 个月按最近记录/预期推算':''].filter(Boolean).join('，')+'）' : '';
  const bal = totalIn-totalOut;
  const monthsWithData = labels.filter((_,i)=>incomeData[i]>0||outData[i]>0).length || 1;
  const avgBal = bal/monthsWithData;
  const saveRate = totalIn>0 ? bal/totalIn*100 : 0;
  let best=null, worst=null;
  balData.forEach((v,i)=>{
    if(!(incomeData[i]>0||outData[i]>0)) return;
    if(!best || v>best.v) best={m:i+1,v};
    if(!worst || v<worst.v) worst={m:i+1,v};
  });
  openModal(`
    <h2>${ic('file-text',18)} 现金流 · 年度总结</h2>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin:8px 0 12px">
      ${years.map(yy=>`<button class="btn btn-sm ${String(yy)===String(year)?'btn-primary':'btn-ghost'}" onclick="openCashAnnual('${yy}')">${yy} 年</button>`).join('')}
    </div>
    <div class="card" style="border-color:var(--acc-35)">
      <div class="row">
        <div class="grow"><div class="sub">${year} 年结余（收入 − 开销）</div>
          <div class="big-num" style="color:${bal>=0?'var(--green)':'var(--red)'}">${bal>=0?'+':''}${money(bal)}</div></div>
        <span style="color:${bal>=0?'var(--green)':'var(--red)'}">${ic(bal>=0?'shield':'alert',30)}</span>
      </div>
      <div class="divider"></div>
      <div class="row sub money">
        <span>总收入 <b style="color:var(--green)">${money(totalIn)}</b></span>
        <span style="margin-left:auto">总支出 <b style="color:var(--red)">${money(totalOut)}</b></span>
      </div>
      <div class="row sub money" style="margin-top:6px">
        <span>月均结余 <b style="color:${avgBal>=0?'var(--green)':'var(--red)'}">${money(avgBal)}</b></span>
        <span style="margin-left:auto">储蓄率 <b style="color:var(--accent)">${totalIn>0?saveRate.toFixed(1)+'%':'—'}</b></span>
      </div>
      <div class="sub" style="margin-top:8px">统计 ${monthsWithData} 个月${wageDesc}</div>
    </div>
    <div class="card">
      <h3>${ic('pie',15)} ${year} 年开销构成</h3>
      <canvas class="chart" id="annualDonut" style="height:170px"></canvas>
      <div class="chart-legend">
        <span><b style="background:#2563eb"></b>必需 ${money(ess)}</span>
        <span><b style="background:#f59e0b"></b>娱乐 ${money(fun)}</span>
        <span><b style="background:#7c3aed"></b>学习 ${money(stu)}</span>
      </div>
    </div>
    <div class="card">
      <h3>${ic('trending-up',15)} 全年收入 / 支出</h3>
      <canvas class="chart" id="annualLine" style="height:170px"></canvas>
      <div class="chart-legend">
        <span><b style="background:#10b981"></b>收入</span>
        <span><b style="background:#dc2626"></b>支出</span>
      </div>
      <div class="divider"></div>
      <div class="row sub" style="flex-wrap:wrap;gap:6px">
        ${labels.map((l,i)=>`<span style="min-width:52px">${l} <b class="money" style="color:${balData[i]>0?'var(--green)':(balData[i]<0?'var(--red)':'var(--sub)')}">${balData[i]>0?'+':''}${Math.round(balData[i])}</b></span>`).join('')}
      </div>
      ${best?`<div class="sub" style="margin-top:8px">最佳月份 <b style="color:var(--green)">${best.m}月 +${Math.round(best.v)}</b> · 最紧月份 <b style="color:var(--red)">${worst.m}月 ${worst.v>=0?'+':''}${Math.round(worst.v)}</b></div>`:'<div class="sub" style="margin-top:8px">该年度暂无流水记录</div>'}
    </div>
    <button class="btn btn-ghost" onclick="closeModal()">关闭</button>`);
  requestAnimationFrame(()=>{
    drawDonut($('#annualDonut'), [
      {label:'必需',value:ess,color:'#2563eb'},
      {label:'娱乐',value:fun,color:'#f59e0b'},
      {label:'学习',value:stu,color:'#7c3aed'}
    ], money(totalOut));
    drawLineChart($('#annualLine'), [
      {name:'收入',color:'#10b981',data:incomeData},
      {name:'支出',color:'#dc2626',data:outData}
    ], labels);
  });
}

/* ---- 模块3：资产持仓（基金 / 债券 / ETF / 股票） ---- */
const ASSET_TYPES = ['基金','债券','ETF','股票'];
const ASSET_ICON = {'基金':'pie','债券':'wallet','ETF':'bar-chart','股票':'trending-up'};
function assetProfit(a){ return (a.changes||[]).reduce((s,c)=>s+num(c.amount),0); }
function assetValue(a){ return num(a.principal) + assetProfit(a); }
function assetHoldDays(a){ return Math.max(1, daysBetween(a.startDate, todayStr())); }
function assetAnnual(a){
  const p = num(a.principal);
  if(!p) return null;
  return assetProfit(a) / p * 365 / assetHoldDays(a) * 100;
}
function fmtAnnual(a){
  const r = assetAnnual(a);
  return r==null ? '—' : (r>=0?'+':'') + r.toFixed(1) + '%';
}
function renderAssetsView(){
  const el = $('#wealth-assets');
  const list = [...(state.wealth.assets||[])].sort((a,b)=>assetValue(b)-assetValue(a));
  const totalVal = list.reduce((a,x)=>a+assetValue(x),0);
  const totalPri = list.reduce((a,x)=>a+num(x.principal),0);
  const totalPro = list.reduce((a,x)=>a+assetProfit(x),0);
  let html = '';
  if(!list.length){
    html += `<div class="card empty">${ic('trending-up',28)}<br>还没有资产记录<br><span class="sub">录入基金 / 债券 / ETF / 股票的本金，再随时记录浮动盈亏<br>自动计算当前市值与年化收益率</span></div>`;
  }else{
    html += `<div class="card" style="border-color:var(--acc-35)">
      <h3><button class="btn btn-sm btn-ghost" style="float:right;margin-top:-4px" onclick="openAssetAnnual()">年度总结</button>${ic('bar-chart',15)} 持仓总览</h3>
      <div class="row">
        <div class="grow"><div class="sub">总市值</div><div class="big-num">${money(totalVal)}</div></div>
        <div style="text-align:right"><div class="sub">总浮动盈亏</div>
          <div class="big-num" style="font-size:20px;color:${totalPro>=0?'var(--green)':'var(--red)'}">${totalPro>=0?'+':''}${money(totalPro)}</div></div>
      </div>
      ${totalPri>0?`<div class="sub" style="margin-top:6px">总本金 ${money(totalPri)} · 累计收益率 ${((totalPro/totalPri)*100).toFixed(1)}%</div>`:''}
    </div>
    <div class="stack">` + list.map(a=>{
      const pro = assetProfit(a);
      return `<div class="card clickable" onclick="openAssetDetail('${a.id}')">
        <div class="row">
          <span class="icon-box">${ic(ASSET_ICON[a.type]||'trending-up',20)}</span>
          <div class="grow">
            <div class="row"><b>${esc(a.name)}</b><span class="tag blue" style="margin-left:8px">${esc(a.type)}</span></div>
            <div class="sub money" style="margin-top:3px">本金 ${money(a.principal)} · 当前 <b style="color:var(--text)">${money(assetValue(a))}</b></div>
            <div class="sub money">浮动 <b style="color:${pro>=0?'var(--green)':'var(--red)'}">${pro>=0?'+':''}${money(pro)}</b> · 年化 <b style="color:${pro>=0?'var(--green)':'var(--red)'}">${fmtAnnual(a)}</b> · 持有 ${assetHoldDays(a)} 天</div>
          </div>
        </div></div>`;
    }).join('') + `</div>`;
  }
  el.innerHTML = html;
}
/* ---- 资产：年度总结 ---- */
let assetAnnualYear = null;
const TYPE_COLORS = {'基金':'#2563eb','债券':'#f59e0b','ETF':'#7c3aed','股票':'#10b981'};
function assetYears(){
  const set = new Set([String(new Date().getFullYear())]);
  (state.wealth.assets||[]).forEach(a=>{
    if(a.startDate) set.add(a.startDate.slice(0,4));
    (a.changes||[]).forEach(c=>{ if(c.date) set.add(c.date.slice(0,4)); });
  });
  return [...set].sort().reverse();
}
// 截至某日（含）的市值；该日尚未建仓返回 null
function assetValueAt(a, day){
  if(a.startDate > day) return null;
  const ch = (a.changes||[]).filter(c=>c.date<=day).reduce((s,c)=>s+num(c.amount),0);
  return num(a.principal) + ch;
}
function openAssetAnnual(y){
  const list = state.wealth.assets||[];
  if(!list.length){ toast('还没有资产记录，先添加一项资产'); return; }
  const years = assetYears();
  const year = String(y || assetAnnualYear || years[0]);
  assetAnnualYear = year;
  const yearStart = year+'-01-01', yearEnd = year+'-12-31', prevEnd = (parseInt(year,10)-1)+'-12-31';
  const rows = [];
  const byType = {};
  let beginTotal=0, endTotal=0, addedTotal=0, netTotal=0;
  list.forEach(a=>{
    if(a.startDate > yearEnd) return;
    const begin = assetValueAt(a, prevEnd) || 0;
    const end   = assetValueAt(a, yearEnd) || 0;
    const added = (a.startDate >= yearStart) ? num(a.principal) : 0;
    const net   = end - begin - added;
    const base  = begin + added;
    beginTotal += begin; endTotal += end; addedTotal += added; netTotal += net;
    byType[a.type] = (byType[a.type]||0) + end;
    rows.push({a, begin, end, added, net, ret: base>0 ? net/base*100 : null});
  });
  rows.sort((x,z)=>z.net-x.net);
  const ret = (beginTotal+addedTotal)>0 ? netTotal/(beginTotal+addedTotal)*100 : null;
  const labels=[], curve=[];
  for(let m=1;m<=12;m++){
    const lastDay = new Date(parseInt(year,10), m, 0).getDate();
    const day = year+'-'+String(m).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
    labels.push(m+'月');
    curve.push(list.reduce((s,a)=>s+(assetValueAt(a,day)||0),0));
  }
  const segs = ASSET_TYPES.filter(t=>byType[t]>0).map(t=>({label:t,value:byType[t],color:TYPE_COLORS[t]}));
  openModal(`
    <h2>${ic('file-text',18)} 资产 · 年度总结</h2>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin:8px 0 12px">
      ${years.map(yy=>`<button class="btn btn-sm ${String(yy)===year?'btn-primary':'btn-ghost'}" onclick="openAssetAnnual('${yy}')">${yy} 年</button>`).join('')}
    </div>
    <div class="card" style="border-color:var(--acc-35)">
      <div class="row">
        <div class="grow"><div class="sub">${year} 年末总市值</div><div class="big-num">${money(endTotal)}</div></div>
        <div style="text-align:right"><div class="sub">年内净盈亏</div>
          <div class="big-num" style="font-size:20px;color:${netTotal>=0?'var(--green)':'var(--red)'}">${netTotal>=0?'+':''}${money(netTotal)}</div></div>
      </div>
      <div class="divider"></div>
      <div class="row sub money">
        <span>年初 <b style="color:var(--text)">${money(beginTotal)}</b></span>
        <span style="margin-left:auto">年内新增本金 <b style="color:var(--text)">${money(addedTotal)}</b></span>
      </div>
      <div class="row sub money" style="margin-top:6px">
        <span>年内收益率 <b style="color:${netTotal>=0?'var(--green)':'var(--red)'}">${ret==null?'—':(ret>=0?'+':'')+ret.toFixed(1)+'%'}</b></span>
        <span style="margin-left:auto">持仓 ${rows.length} 项 · ${year} 年有动作 ${rows.filter(r=>r.added||r.net||r.a.changes&&r.a.changes.some(c=>c.date>=yearStart&&c.date<=yearEnd)).length} 项</span>
      </div>
      <div class="sub" style="margin-top:8px">净盈亏已扣除年内新增本金；${year} 为当前年份时只统计已发生的月份</div>
    </div>
    <div class="card">
      <h3>${ic('trending-up',15)} 全年市值走势（每月月末）</h3>
      <canvas class="chart" id="assetAnnualLine" style="height:170px"></canvas>
    </div>
    ${segs.length?`<div class="card">
      <h3>${ic('pie',15)} ${year} 年末持仓结构</h3>
      <canvas class="chart" id="assetAnnualDonut" style="height:170px"></canvas>
      <div class="chart-legend">${segs.map(s=>`<span><b style="background:${s.color}"></b>${s.label} ${money(s.value)}</span>`).join('')}</div>
    </div>`:''}
    <div class="card">
      <h3>${ic('list',15)} 各资产年内表现</h3>
      ${rows.length ? rows.map(r=>{
        const act = r.added || r.net;
        return `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">
          <span class="icon-box">${ic(ASSET_ICON[r.a.type]||'trending-up',18)}</span>
          <div class="grow" style="min-width:0">
            <b>${esc(r.a.name)}</b><span class="tag blue" style="margin-left:6px">${esc(r.a.type)}</span>
            <div class="sub money">年初 ${money(r.begin)} → 年末 ${money(r.end)}${r.added?' · 新增本金 '+money(r.added):''}</div>
          </div>
          <div style="text-align:right">
            <b class="money" style="color:${r.net>=0?'var(--green)':'var(--red)'}">${r.net>=0?'+':''}${money(r.net)}</b>
            <div class="sub money">${act&&r.ret!=null?((r.ret>=0?'+':'')+r.ret.toFixed(1)+'%'):''}</div>
          </div>
        </div>`;
      }).join('') : `<div class="sub" style="padding:6px 0">${year} 年还没有建仓的资产</div>`}
    </div>
    <button class="btn btn-ghost" onclick="closeModal()">关闭</button>`);
  requestAnimationFrame(()=>{
    drawLineChart($('#assetAnnualLine'), [{name:'市值',color:'#2563eb',data:curve}], labels);
    if(segs.length) drawDonut($('#assetAnnualDonut'), segs, money(endTotal));
  });
}

    <div class="field"><label class="req">类型</label>
      <select id="asType">${ASSET_TYPES.map(t=>`<option value="${t}" ${a&&a.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label class="req">名称</label><input type="text" id="asName" value="${a?esc(a.name):''}" placeholder="例如：沪深300指数基金"></div>
    <div class="field"><label class="req">投入本金（元）</label><input type="number" id="asPrincipal" inputmode="decimal" value="${a?a.principal:''}" placeholder="例如：10000"></div>
    <div class="field"><label class="req">建仓日期</label><input type="date" id="asDate" value="${a?a.startDate:todayStr()}"></div>

function deleteAsset(id){

}

function careerHourly(c){
  const h = c.hours||0;
  return (c.income && h) ? Math.round(c.income/(h*21.75)) : null; // 预期时薪 = 月收入 ÷ (日均工时 × 21.75 月均工作日)
}
/* ---- 发薪记录（每月一条：到手总额 + 本月实际总工时） ---- */
function curMonthKey(){ const n=new Date(); return ymKey(n.getFullYear(), n.getMonth()+1); }
function payList(){
  return [...(state.career.current.pays||[])].sort((a,b)=> a.month<b.month ? -1 : 1);
}
// 某个月的工资口径：本月记录 > 之前最近一条记录推算 > 职业档案预期值
function payFor(month){
  const c = state.career.current;
  const rec = (c.pays||[]).find(p=>p.month===month);
  if(rec) return {income:num(rec.income), hours:num(rec.hours), src:'record', from:month};
  const prior = payList().filter(p=>p.month<month).pop();
  if(prior) return {income:num(prior.income), hours:num(prior.hours), src:'carry', from:prior.month};
  if(c.income) return {income:num(c.income), hours:(num(c.hours)||8)*21.75, src:'expect', from:''};
  return {income:0, hours:0, src:'none', from:''};
}
function payHourly(p){ return p && p.hours>0 ? p.income/p.hours : null; }
// 只按真实记录统计；n 条记录的合计与加权时薪（Σ收入 ÷ Σ工时）
function payStats(n){
  const recs = n ? payList().slice(-n) : payList();
  const inc = recs.reduce((a,p)=>a+num(p.income),0);
  const hrs = recs.reduce((a,p)=>a+num(p.hours),0);
  return {count:recs.length, avgInc: recs.length?inc/recs.length:0,
          avgHours: recs.length?hrs/recs.length:0, hourly: hrs>0?inc/hrs:null, totalInc:inc};
}
function payYearTotal(year){
  return (state.career.current.pays||[]).filter(p=>p.month.slice(0,4)===String(year))
    .reduce((a,p)=>a+num(p.income),0);
}
// 达成率用近期均值，避免单月奖金造成虚高；无记录时退回预期收入
function careerMonthlyBase(){
  const s = payStats(3);
  return s.count ? s.avgInc : num(state.career.current.income);
}

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function importAll(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(String(reader.result));
      let life = (obj && obj.app==='lifeRPG' && obj.life) ? obj.life : null;
      if(!life && obj && Array.isArray(obj.skills)) life = obj; // 兼容纯生活数据快照
      if(life && confirm('导入将覆盖当前 技能/财富/健康/职业 数据，确定继续？')){
        state.skills = Array.isArray(life.skills) ? normalizeSkillTones(life.skills) : [];
        state.wealth = Object.assign({items:[],incomes:[],expenses:[],assets:[],fixed:[]}, life.wealth);
        state.health = Object.assign({birthday:null,diseases:[]}, life.health);
        state.career.current = Object.assign({name:'',income:0,hours:8,satisfaction:3,pays:[]}, life.career && life.career.current);
        state.career.current.pays = (state.career.current.pays||[]).filter(p=>p && p.month);
        state.career.target = Object.assign({name:'',income:0,skills:[]}, life.career && life.career.target);
        save(); renderCurrentPage();
      }
      if(obj && obj.diary && obj.diary.entries && window.dyAPI && dyAPI.importEntries){
        const r = dyAPI.importEntries(obj.diary.entries);
        if(life) toast('导入完成 · 日记：新增 '+r.added+' 篇 / 更新 '+r.updated+' 篇');
        else toast('日记导入：新增 '+r.added+' 篇 / 更新 '+r.updated+' 篇');
      } else if(life){ toast('导入完成'); }
      else { toast('文件格式不对，请选择本应用导出的 JSON'); }
    }catch(err){ toast('导入失败：'+err.message); }
  };
  reader.onerror = () => toast('文件读取失败');
  reader.readAsText(file, 'utf-8');
}

/* ============ 日记页（整合自 diary.html，自包含模块） ============ */
(function(){
  "use strict";
  var DATA_KEY = "qw-diary:entries:v1";
  var CONF_KEY = "qw-diary:settings:v1";
  var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
  var data = { entries: [] };
  var conf = { theme: "blue", lastBackupAt: null, lastBackupCount: 0 };
  var query = "";
  var editor = { id: null, timer: null, open: false };
  var readIndex = -1;
  var g = function(id){ return document.getElementById(id); };
  var pageEl = g("page-diary");

  /* ---------------- storage ---------------- */
  function readJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      if(!raw) return fallback;
      var val = JSON.parse(raw);
      return (val && typeof val === "object") ? val : fallback;
    }catch(e){ return fallback; }
  }
  function writeJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ toast("保存失败：浏览器存储已满或被禁用"); return false; }
  }
  function saveData(){ return writeJSON(DATA_KEY, data); }
  function saveConf(){ writeJSON(CONF_KEY, conf); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ---------------- date helpers ---------------- */
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function todayStr(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function toDate(str){ var p = String(str || "").split("-"); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
  function fmtDate(str){ var d = toDate(str); return d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日 " + WEEK[d.getDay()]; }
  function fmtDay(str){ return (new Date()).getFullYear() === toDate(str).getFullYear() ? String(toDate(str).getDate()) : toDate(str).getDate() + "." + (toDate(str).getMonth()+1); }
  function fmtTime(iso){
    if(!iso) return "";
    var d = new Date(iso); if(isNaN(d.getTime())) return "";
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function monthKey(str){ var p = String(str).split("-"); return p[0] + "-" + p[1]; }
  function monthLabel(key){ var p = key.split("-"); return p[0] + " 年 " + (+p[1]) + " 月"; }
  function relative(iso){
    if(!iso) return "";
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if(diff < 60) return "刚刚";
    if(diff < 3600) return Math.floor(diff/60) + " 分钟前";
    if(diff < 86400) return Math.floor(diff/3600) + " 小时前";
    if(diff < 86400*8) return Math.floor(diff/86400) + " 天前";
    return fmtTime(iso);
  }
  function countChars(s){ return String(s || "").replace(/\s/g, "").length; }

  /* ---------------- data ops ---------------- */
  function live(){
    return data.entries.filter(function(e){ return !e.deletedAt; });
  }
  function sortedLive(){
    return live().slice().sort(function(a, b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.updatedAt || "") < (a.updatedAt || "") ? -1 : 1;
    });
  }
  function filtered(){
    var list = sortedLive();
    var q = query.trim().toLowerCase();
    if(!q) return list;
    return list.filter(function(e){
      return (e.title + " " + e.body + " " + e.date).toLowerCase().indexOf(q) >= 0;
    });
  }
  function find(id){
    for(var i = 0; i < data.entries.length; i++){ if(data.entries[i].id === id) return data.entries[i]; }
    return null;
  }
  function streak(){
    var days = {};
    live().forEach(function(e){ days[e.date] = 1; });
    var d = new Date();
    if(!days[todayStr()]) d.setDate(d.getDate() - 1);
    var n = 0;
    while(days[d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate())]){
      n++; d.setDate(d.getDate() - 1);
    }
    return n;
  }

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function toast(msg, actionLabel, actionFn){
    var el = g("dyToast");
    el.textContent = "";
    var span = document.createElement("span"); span.textContent = msg; el.appendChild(span);
    if(actionLabel && actionFn){
      var b = document.createElement("button"); b.textContent = actionLabel;
      b.onclick = function(){ hideToast(); actionFn(); };
      el.appendChild(b);
    }
    el.style.display = "flex";
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 2200);
  }
  function hideToast(){
    var el = g("dyToast");
    el.style.display = "none"; el.textContent = "";
    if(toastTimer){ clearTimeout(toastTimer); toastTimer = null; }
  }

  /* ---------------- render list ---------------- */
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function renderStats(){
    var list = live();
    var words = 0;
    list.forEach(function(e){ words += countChars(e.body) + countChars(e.title); });
    var s = g("dyStats");
    s.textContent = "";
    function item(n, label){
      var w = el("span"); w.appendChild(el("b", null, n)); w.appendChild(document.createTextNode(label)); return w;
    }
    s.appendChild(item(String(list.length), " 篇"));
    s.appendChild(item(String(streak()), " 天连续"));
    s.appendChild(item(words > 9999 ? (words/10000).toFixed(1) + "w" : String(words), " 字"));
    if(query.trim()) s.appendChild(el("span", null, "· 匹配 " + filtered().length + " 篇"));
  }

  function renderList(){
    var host = g("dyList");
    host.textContent = "";
    renderStats();
    var list = filtered();

    if(!data.entries.length){
      var e0 = el("div", "dy-empty");
      e0.appendChild(el("h3", null, "从今天的三句话开始"));
      e0.appendChild(el("p", null, "不需要写得多好。今天吃了什么、见了谁、有什么不爽，记下来就好。"));
      var b0 = el("button", "dy-btn-primary", "写第一篇");
      b0.onclick = function(){ openEditor(null); };
      e0.appendChild(b0);
      host.appendChild(e0);
      renderFootnote(); return;
    }
    if(!list.length){
      var e1 = el("div", "dy-empty");
      e1.appendChild(el("h3", null, "没有找到相关日记"));
      e1.appendChild(el("p", null, "换个关键词试试，或者清空搜索框。"));
      var b1 = el("button", null, "清空搜索");
      b1.onclick = function(){ query = ""; g("dySearch").value = ""; renderList(); };
      e1.appendChild(b1);
      host.appendChild(e1);
      renderFootnote(); return;
    }

    var curMonth = null, group = null, countNode = null, n = 0;
    list.forEach(function(entry){
      var mk = monthKey(entry.date);
      if(mk !== curMonth){
        if(!group){
          var sec = el("section", "dy-month");
          var head = el("div", "dy-month-head");
          head.appendChild(el("h2", null, monthLabel(mk)));
          countNode = el("span", null, "0 篇");
          head.appendChild(countNode);
          sec.appendChild(head);
          group = el("div");
          sec.appendChild(group);
          host.appendChild(sec);
        }else{
          countNode.textContent = n + " 篇";
          n = 0;
          var sec2 = el("section", "dy-month");
          var head2 = el("div", "dy-month-head");
          head2.appendChild(el("h2", null, monthLabel(mk)));
          countNode = el("span", null, "0 篇");
          head2.appendChild(countNode);
          sec2.appendChild(head2);
          group = el("div");
          sec2.appendChild(group);
          host.appendChild(sec2);
        }
        curMonth = mk;
      }
      group.appendChild(entryCard(entry));
      n++;
    });
    countNode.textContent = n + " 篇";
    renderFootnote();
  }

  function renderFootnote(){
    var f = g("dyFootnote");
    var msgs = [];
    if(conf.lastBackupAt) msgs.push("上次备份：" + fmtTime(conf.lastBackupAt));
    else msgs.push("还没有导出过备份");
    var days = Math.floor((Date.now() - (conf.lastBackupAt ? new Date(conf.lastBackupAt).getTime() : 0)) / 86400000);
    if(!conf.lastBackupAt || days >= 7) msgs.push("· 建议现在导出一次备份");
    f.textContent = msgs.join(" ");
  }

  function entryCard(entry){
    var card = el("div", "dy-entry");
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", fmtDate(entry.date) + " 的日记");
    var d = toDate(entry.date);
    var left = el("div", "day");
    left.appendChild(document.createTextNode(fmtDay(entry.date)));
    left.appendChild(el("span", "dow", WEEK[d.getDay()].replace("周", "")));
    card.appendChild(left);

    var right = el("div");
    right.appendChild(el("div", "t", entry.title || firstLine(entry.body) || "（无标题）"));
    var snippet = entry.title ? entry.body : bodyWithoutFirstLine(entry.body);
    right.appendChild(el("div", "s", snippet ? snippet.replace(/\s+/g, " ").trim() : "（无正文）"));
    var meta = [];
    meta.push(countChars(entry.body) + " 字");
    if(entry.updatedAt && entry.updatedAt.slice(0, 10) !== entry.date) meta.push("更新于 " + relative(entry.updatedAt));
    right.appendChild(el("div", "meta", meta.join(" · ")));
    card.appendChild(right);

    card.onclick = function(){ openRead(entry.id); };
    card.onkeydown = function(ev){
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); openRead(entry.id); }
    };
    return card;
  }
  function firstLine(t){
    var s = String(t || "").split("\n").filter(function(x){ return x.trim(); });
    return s.length ? s[0].trim().slice(0, 24) : "";
  }
  function bodyWithoutFirstLine(t){
    var lines = String(t || "").split("\n");
    var i = 0;
    while(i < lines.length && !lines[i].trim()) i++;
    return lines.slice(i + 1).join("\n").trim();
  }

  /* ---------------- editor ---------------- */
  function openEditor(id){
    var entry = id ? find(id) : null;
    editor.id = entry ? entry.id : null;
    g("dyEditorHeadTitle").textContent = entry ? "编辑日记" : "写日记";
    g("dyEditorDate").value = entry ? entry.date : todayStr();
    g("dyEditorTitle").value = entry ? (entry.title || "") : "";
    g("dyEditorBody").value = entry ? entry.body : "";
    setOverlay("dyEditorOverlay", true);
    editor.open = true;
    updateEditorMeta("已保存");
    var body = g("dyEditorBody");
    setTimeout(function(){ body.focus(); }, 60);
  }
  function closeEditor(){
    flushSave();
    editor.open = false;
    setOverlay("dyEditorOverlay", false);
    editor.id = null;
    renderList();
  }
  function editorPayload(){
    return {
      id: editor.id,
      date: g("dyEditorDate").value || todayStr(),
      title: g("dyEditorTitle").value.trim(),
      body: g("dyEditorBody").value
    };
  }
  function isEmptyBuffer(){
    var p = editorPayload();
    return !p.title && !p.body.trim();
  }
  function flushSave(){
    if(editor.timer){ clearTimeout(editor.timer); editor.timer = null; }
    if(!editor.open) return;
    if(!editor.id && isEmptyBuffer()) return;
    doSave();
  }
  function scheduleSave(status){
    if(!editor.open) return;
    if(status) updateEditorMeta("输入中…");
    if(editor.timer) clearTimeout(editor.timer);
    editor.timer = setTimeout(function(){
      editor.timer = null;
      if(!editor.id && isEmptyBuffer()){ updateEditorMeta("空白，未保存"); return; }
      doSave();
    }, 700);
  }
  function doSave(){
    var p = editorPayload();
    var now = new Date().toISOString();
    if(editor.id){
      var e = find(editor.id);
      if(e){
        var changed = e.date !== p.date || e.title !== p.title || e.body !== p.body;
        if(changed){
          e.date = p.date; e.title = p.title; e.body = p.body; e.updatedAt = now;
          saveData();
        }
      }
    }else{
      p.id = uid(); p.createdAt = now; p.updatedAt = now; p.deletedAt = null;
      data.entries.push(p); editor.id = p.id;
      saveData();
    }
    updateEditorMeta("已保存 · " + fmtTime(new Date().toISOString()).slice(11));
  }
  function updateEditorMeta(status){
    g("dyEditorStatus").textContent = status || "";
    var p = editorPayload();
    g("dyEditorCount").textContent = countChars(p.body) + " 字 · " + fmtDate(p.date);
  }

  /* ---------------- read ---------------- */
  function openRead(id){
    var list = filtered();
    readIndex = -1;
    for(var i = 0; i < list.length; i++){ if(list[i].id === id){ readIndex = i; break; } }
    if(readIndex < 0){ toast("这篇日记不在当前搜索结果里"); return; }
    paintRead();
    setOverlay("dyReadOverlay", true);
  }
  function paintRead(){
    var list = filtered();
    var e = list[readIndex];
    if(!e){ closeRead(); return; }
    g("dyReadDate").textContent = fmtDate(e.date);
    g("dyReadTitle").textContent = e.title || "（无标题）";
    var meta = [];
    meta.push(countChars(e.body) + " 字");
    meta.push("写于 " + fmtTime(e.createdAt));
    if(e.updatedAt && e.updatedAt.slice(0, 10) !== e.date) meta.push("改于 " + fmtTime(e.updatedAt));
    g("dyReadMeta").textContent = meta.join(" · ");
    g("dyReadBody").textContent = e.body || "（无正文）";
    g("dyReadPos").textContent = (readIndex + 1) + " / " + list.length;
    g("dyReadPrev").disabled = readIndex >= list.length - 1;
    g("dyReadNext").disabled = readIndex <= 0;
    g("dyReadBody").parentNode.scrollTop = 0;
  }
  function closeRead(){ setOverlay("dyReadOverlay", false); renderList(); }
  function removeEntry(id){
    var e = find(id);
    if(!e) return;
    e.deletedAt = new Date().toISOString();
    saveData();
    toast("已删除，可在回收站恢复", "撤销", function(){
      e.deletedAt = null; saveData(); renderList(); toast("已恢复");
    });
  }

  /* ---------------- overlays ---------------- */
  function setOverlay(id, on){
    var o = g(id);
    o.hidden = !on;
    document.body.style.overflow = on ? "hidden" : "";
  }

  /* ---------------- settings / trash ---------------- */
  function applyTheme(){
    var t = conf.theme;
    if(t !== "blue" && t !== "paper" && t !== "dark") t = "blue";
    document.body.setAttribute("data-theme", t);
    g("dyBtnTheme").textContent = t === "blue" ? "蓝" : (t === "paper" ? "黄" : "黑");
    Array.prototype.forEach.call(document.querySelectorAll("#dyThemeSeg button"), function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-t") === conf.theme));
    });
  }
  function renderSettings(){
    g("dyBackupInfo").textContent = conf.lastBackupAt
      ? "上次导出：" + fmtTime(conf.lastBackupAt) + "（" + conf.lastBackupCount + " 篇）"
      : "下载一个 JSON 文件，保存所有日记";
    var trashed = data.entries.filter(function(e){ return e.deletedAt; }).length;
    g("dyTrashInfo").textContent = trashed ? trashed + " 篇在回收站里" : "删除的日记会先进这里";
    var info = g("dyStorageInfo");
    try{
      var used = 0;
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf("qw-diary") === 0) used += (localStorage.getItem(k) || "").length;
      }
      info.textContent = "当前占用本地存储约 " + (used / 1024).toFixed(1) + " KB。浏览器对单个站点的配额通常是几 MB，够写很多年。";
    }catch(e){ info.textContent = ""; }
    renderFootnote();
  }
  function renderTrash(){
    var host = g("dyTrashList");
    host.textContent = "";
    var items = data.entries.filter(function(e){ return e.deletedAt; }).sort(function(a, b){
      return a.deletedAt < b.deletedAt ? 1 : -1;
    });
    if(!items.length){
      host.appendChild(el("p", "dy-note", "回收站是空的。删除的日记会先放在这里，随时可以恢复。"));
      return;
    }
    items.forEach(function(e){
      var row = el("div", "dy-trash-item");
      var left = el("div");
      left.appendChild(el("div", "ti-t", e.title || firstLine(e.body) || "（无标题）"));
      left.appendChild(el("div", "ti-s", fmtDate(e.date) + " · 删除于 " + fmtTime(e.deletedAt)));
      row.appendChild(left);
      var acts = el("div", "ti-a");
      var rb = el("button", null, "恢复");
      rb.onclick = function(){ e.deletedAt = null; saveData(); renderTrash(); renderSettings(); toast("已恢复"); };
      var db = el("button", "dy-btn-danger", "彻底删除");
      db.onclick = function(){
        if(!window.confirm("彻底删除这篇日记？这个操作无法撤销，建议先导出一份备份。")) return;
        data.entries = data.entries.filter(function(x){ return x.id !== e.id; });
        saveData(); renderTrash(); renderSettings(); toast("已彻底删除");
      };
      acts.appendChild(rb); acts.appendChild(db);
      row.appendChild(acts);
      host.appendChild(row);
    });
  }
  function snapshot(){
    return {
      app: "local-diary", version: 1, exportedAt: new Date().toISOString(),
      entries: data.entries
    };
  }
  function exportBackup(){
    if(!data.entries.length){ toast("还没有内容可以备份"); return; }
    try{
      var blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "diary-backup-" + todayStr() + ".json";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      conf.lastBackupAt = new Date().toISOString();
      conf.lastBackupCount = live().length;
      saveConf(); renderSettings();
      toast("备份文件已导出");
    }catch(e){ toast("导出失败：" + e.message); }
  }
  function importEntries(incoming){
    var added = 0, updated = 0, skipped = 0;
    (Array.isArray(incoming) ? incoming : []).forEach(function(r){
      if(!r || typeof r.body !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(String(r.date || ""))){ skipped++; return; }
      var rec = {
        id: String(r.id || uid()), date: r.date,
        title: typeof r.title === "string" ? r.title : "",
        body: r.body,
        createdAt: r.createdAt || new Date().toISOString(),
        updatedAt: r.updatedAt || r.createdAt || new Date().toISOString(),
        deletedAt: r.deletedAt || null
      };
      var old = find(rec.id);
      if(!old){ data.entries.push(rec); added++; }
      else{
        if(String(old.updatedAt || "") < String(rec.updatedAt || "")){
          data.entries[data.entries.indexOf(old)] = rec; updated++;
        }else skipped++;
      }
    });
    saveData(); renderList(); renderSettings();
    return { added: added, updated: updated, skipped: skipped };
  }
  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var obj = JSON.parse(String(reader.result));
        var incoming = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.entries) ? obj.entries : null);
        if(!incoming){ toast("文件格式不对，请选择本应用导出的 JSON"); return; }
        var r = importEntries(incoming);
        toast("导入完成：新增 " + r.added + " 篇，更新 " + r.updated + " 篇" + (r.skipped ? "，跳过 " + r.skipped + " 篇" : ""));
      }catch(err){ toast("读取失败：" + err.message); }
    };
    reader.onerror = function(){ toast("文件读取失败"); };
    reader.readAsText(file, "utf-8");
  }
  function wipeAll(){
    if(!data.entries.length){ toast("本来就是空的"); return; }
    if(!window.confirm("确定清空这台设备上的全部日记？会先帮你导出一个备份文件。")) return;
    exportBackup();
    setTimeout(function(){
      data.entries = [];
      saveData(); renderList(); renderSettings();
      toast("已清空（备份文件应该已下载，请确认）");
    }, 900);
  }

  /* ---------------- events ---------------- */
  function bind(){
    g("dyBtnNew").onclick = function(){ openEditor(null); };
    g("dyBtnTheme").onclick = function(){
      var order = ["blue", "paper", "dark"];
      if(order.indexOf(conf.theme) < 0) conf.theme = "blue";
      conf.theme = order[(order.indexOf(conf.theme) + 1) % order.length];
      saveConf(); applyTheme(); renderSettings();
      toast("主题颜色：" + ({ blue: "蓝色", paper: "暖黄", dark: "黑色" })[conf.theme]);
    };
    g("dyBtnSettings").onclick = function(){ renderSettings(); setOverlay("dySettingsOverlay", true); };
    g("dySettingsClose").onclick = function(){ setOverlay("dySettingsOverlay", false); };
    g("dySettingsOverlay").onclick = function(ev){
      if(ev.target === this) setOverlay("dySettingsOverlay", false);
    };
    g("dyTrashClose").onclick = function(){ setOverlay("dyTrashOverlay", false); renderSettings(); };
    g("dyBtnTrash").onclick = function(){ renderTrash(); setOverlay("dyTrashOverlay", true); };
    g("dyBtnExport").onclick = exportBackup;
    g("dyBtnImport").onclick = function(){ g("dyImportFile").click(); };
    g("dyImportFile").onchange = function(){
      if(this.files && this.files[0]) importBackup(this.files[0]);
      this.value = "";
    };
    g("dyBtnWipe").onclick = wipeAll;
    Array.prototype.forEach.call(document.querySelectorAll("#dyThemeSeg button"), function(b){
      b.onclick = function(){ conf.theme = b.getAttribute("data-t"); saveConf(); applyTheme(); renderSettings(); };
    });

    g("dyEditorDone").onclick = closeEditor;
    g("dyEditorOverlay").onclick = function(ev){
      if(ev.target === this) closeEditor();
    };
    ["dyEditorTitle", "dyEditorBody"].forEach(function(id){
      var n = g(id);
      n.addEventListener("input", function(){ scheduleSave(true); });
    });
    g("dyEditorDate").addEventListener("change", function(){ flushSave(); updateEditorMeta("已保存"); });
    g("dyEditorBody").addEventListener("keydown", function(ev){
      if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "s"){ ev.preventDefault(); flushSave(); toast("已保存"); }
    });

    g("dyReadClose").onclick = closeRead;
    g("dyReadOverlay").onclick = function(ev){ if(ev.target === this) closeRead(); };
    g("dyReadEdit").onclick = function(){
      var e = filtered()[readIndex]; if(!e) return;
      setOverlay("dyReadOverlay", false); openEditor(e.id);
    };
    g("dyReadDelete").onclick = function(){
      var e = filtered()[readIndex]; if(!e) return;
      var ok = window.confirm("删除这篇日记？（会先进回收站，可以恢复）");
      if(!ok) return;
      removeEntry(e.id);
      closeRead();
    };
    g("dyReadPrev").onclick = function(){
      var list = filtered();
      if(readIndex < list.length - 1){ readIndex++; paintRead(); }
    };
    g("dyReadNext").onclick = function(){
      if(readIndex > 0){ readIndex--; paintRead(); }
    };

    var searchTimer = null;
    g("dySearch").addEventListener("input", function(){
      var v = this.value;
      if(searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function(){ query = v; renderList(); }, 160);
    });

    document.addEventListener("keydown", function(ev){
      if(ev.key !== "Escape") return;
      if(!g("dyTrashOverlay").hidden){ setOverlay("dyTrashOverlay", false); renderSettings(); return; }
      if(!g("dyEditorOverlay").hidden){ closeEditor(); return; }
      if(!g("dyReadOverlay").hidden){ closeRead(); return; }
      if(!g("dySettingsOverlay").hidden){ setOverlay("dySettingsOverlay", false); return; }
    });
    if(window.matchMedia){
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if(mq.addEventListener) mq.addEventListener("change", applyTheme);
      else if(mq.addListener) mq.addListener(applyTheme);
    }
    window.addEventListener("beforeunload", function(){ flushSave(); });
    document.addEventListener("visibilitychange", function(){
      if(document.hidden){ flushSave(); return; }
      data.entries = readJSON(DATA_KEY, { entries: [] }).entries || [];
      renderList();
    });
  }

  /* ---------------- boot ---------------- */
  function boot(){
    try{
      var loaded = readJSON(DATA_KEY, null);
      data.entries = (loaded && Array.isArray(loaded.entries)) ? loaded.entries.filter(function(e){
        return e && typeof e.body === "string" && /^\d{4}-\d{2}-\d{2}$/.test(String(e.date || ""));
      }) : [];
    }catch(e){ data.entries = []; }
    var c = readJSON(CONF_KEY, {});
    if(c && typeof c === "object"){
      if(c.theme === "blue" || c.theme === "paper" || c.theme === "dark") conf.theme = c.theme;
      else if(c.theme === "light") conf.theme = "paper";
      else if(c.theme === "auto") conf.theme = "blue";
      if(c.lastBackupAt) conf.lastBackupAt = c.lastBackupAt;
      if(typeof c.lastBackupCount === "number") conf.lastBackupCount = c.lastBackupCount;
    }
    g("dyTodayLabel").textContent = fmtDate(todayStr());
    applyTheme();
    bind();
